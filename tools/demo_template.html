<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Diary</title>
<style>
:root {
  --bg: #faf7f5; --panel: #ffffff; --ink: #2b2530; --muted: #7a7180; --line: #ebe4e8;
  --accent: #b5476b; --accent-soft: #f6e3ea; --aa: #3d7a6a; --aa-soft: #e1f0eb;
  --r18: #b5476b; --r18-soft: #f6e3ea; --tok: #8a6a1f; --tok-soft: #f6eedb; --chip: #f1edf0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1820; --panel: #24202a; --ink: #ece6ef; --muted: #a39aa8; --line: #352f3c;
    --accent: #e07a9b; --accent-soft: #3d2531; --aa: #7cc4ae; --aa-soft: #1f3530;
    --r18: #e07a9b; --r18-soft: #3d2531; --tok: #d9b45f; --tok-soft: #3a3020; --chip: #2f2a36;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; }
h1 { margin: 0 0 2px; font-size: 22px; letter-spacing: .01em; }
.sub { color: var(--muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0 6px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-size: 20px; }
.stat span { color: var(--muted); font-size: 12px; }
nav { display: flex; gap: 6px; max-width: 1100px; margin: 8px auto 0; padding: 0 16px; flex-wrap: wrap; }
nav button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
  padding: 6px 14px; cursor: pointer; font: inherit; }
nav button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.filters select, .filters input { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); }
.filters input { flex: 1 1 220px; min-width: 0; }
.count { color: var(--muted); font-size: 13px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.title { font-weight: 600; flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
.en { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.chip.aa { background: var(--aa-soft); color: var(--aa); }
.chip.r18 { background: var(--r18-soft); color: var(--r18); }
.chip.tok { background: var(--tok-soft); color: var(--tok); }
.chip.done { background: var(--accent-soft); color: var(--accent); }
.meta { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.family { margin: 6px 0 0 10px; padding-left: 10px; border-left: 2px solid var(--line); }
.family .card { margin-bottom: 6px; padding: 7px 10px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-top: 4px; }
.runtime { font-variant-numeric: tabular-nums; white-space: nowrap; }
.compare { font-size: 13px; }
.compare .real { color: var(--aa); font-weight: 600; }
.compare .est { color: var(--muted); text-decoration: line-through; }
.note { background: var(--tok-soft); color: var(--tok); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
.inbox-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.inbox-actions button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  border-radius: 8px; padding: 3px 10px; cursor: pointer; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Audio Diary <span class="chip">demo</span></h1>
  <div class="sub">Your owned drama CDs, tokutens and audiobooks, with what you've listened to. Built from the real catalogue.</div>
  <div class="stats" id="stats"></div>
</header>
<nav>
  <button data-tab="collection" class="on">Collection</button>
  <button data-tab="listened">Listened</button>
  <button data-tab="inbox">Inbox</button>
</nav>
<main id="main"></main>
<script>
const DATA = /*__DATA__*/null;
const works = DATA.works, byId = Object.fromEntries(works.map(w => [w.work_id, w]));
const listenedIds = new Set(DATA.listened.flatMap(l => l.work_ids));
const mins = w => +w.runtime_min || 0;
const fmt = m => !m ? "—" : m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sheetMin = t => { const m = /(\d+(?:\.\d+)?)\s*(h|m)?/i.exec(t || ""); return m ? Math.round(m[1] * (m[2] === "h" ? 60 : 1)) : 0; };

function stats() {
  const known = works.filter(mins);
  const lis = DATA.listened;
  const realLis = lis.reduce((s, l) => s + (l.work_ids.length ? l.work_ids.reduce((a, i) => a + mins(byId[i] || {}), 0) : 0), 0);
  const estLis = lis.reduce((s, l) => s + sheetMin(l.sheet_time), 0);
  document.getElementById("stats").innerHTML = [
    [works.length, "owned works"],
    [fmt(known.reduce((s, w) => s + mins(w), 0)), `known runtime (${known.length} works)`],
    [lis.length, "CDs listened"],
    [fmt(estLis), "listened, sheet estimate"],
    [works.filter(w => w.owned.includes("packed")).length, "still packed"],
  ].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
}

const state = { tab: "collection", q: "", line: "", age: "", kind: "", heard: "" };
const opts = (k, label) => `<select data-f="${k}"><option value="">${label}: all</option>${
  [...new Set(works.map(w => w[k] || "(unset)"))].sort().map(v => `<option${state[k] === v ? " selected" : ""}>${esc(v)}</option>`).join("")}</select>`;

function chips(w) {
  const age = w.age ? `<span class="chip ${w.age === "AA" ? "aa" : "r18"}">${w.age === "AA" ? "All ages" : "R18"}</span>` : `<span class="chip">age ?</span>`;
  const kind = `<span class="chip ${w.kind === "Tokuten" ? "tok" : ""}">${esc(w.kind)}</span>`;
  const heard = listenedIds.has(w.work_id) ? `<span class="chip done">listened</span>` : "";
  return age + kind + heard;
}

function workCard(w) {
  const meta = [w.series, w.release, w.tracks && `${w.tracks} tracks`, w.owned, w.dlsite, w.note].filter(Boolean).map(esc).join(" · ");
  const jiten = w.jiten ? ` · <a href="${esc(w.jiten)}" target="_blank" rel="noopener">jiten</a>` : "";
  return `<div class="card"><div class="row"><div class="title">${esc(w.title)}${w.title_en && w.title_en !== w.title ? `<div class="en">${esc(w.title_en)}</div>` : ""}</div>
    ${chips(w)}<span class="runtime">${fmt(mins(w))}</span></div><div class="meta">${meta}${jiten}</div></div>`;
}

function matches(w) {
  const q = state.q.toLowerCase();
  return (!q || [w.title, w.title_en, w.series, w.dlsite].join(" ").toLowerCase().includes(q))
    && (!state.line || (w.line || "(unset)") === state.line)
    && (!state.age || (w.age || "(unset)") === state.age)
    && (!state.kind || w.kind === state.kind)
    && (!state.heard || (state.heard === "yes") === listenedIds.has(w.work_id));
}

function collection() {
  const shown = works.filter(matches);
  const shownIds = new Set(shown.map(w => w.work_id));
  // Tokutens with a parent in view hang under it; the rest stand alone.
  const children = {};
  shown.forEach(w => { if (w.parent_id && shownIds.has(w.parent_id)) (children[w.parent_id] ||= []).push(w); });
  const top = shown.filter(w => !(w.parent_id && shownIds.has(w.parent_id)));
  return `<div class="filters"><input data-f="q" placeholder="Search title, series, RJ code…" value="${esc(state.q)}">
    ${opts("line", "Line")}${opts("age", "Age")}${opts("kind", "Kind")}
    <select data-f="heard"><option value="">Listened: all</option><option value="yes"${state.heard === "yes" ? " selected" : ""}>Listened</option><option value="no"${state.heard === "no" ? " selected" : ""}>Not yet</option></select>
    <span class="count">${shown.length} works</span></div>` +
    (top.map(w => workCard(w) + (children[w.work_id] ? `<details class="family"><summary>${children[w.work_id].length} tokuten / bonus CDs</summary>${children[w.work_id].map(workCard).join("")}</details>` : "")).join("")
      || `<div class="empty">Nothing matches.</div>`);
}

function listened() {
  const toDate = s => { const m = /(\d{1,2})[.:](\d{1,2})\.(\d{4})/.exec(s || ""); return m ? `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` : s; };
  const rows = [...DATA.listened].sort((a, b) => toDate(b.finish).localeCompare(toDate(a.finish)));
  return `<div class="note">Each CD you finished, linked to the work in your collection. Where the real runtime is known, it replaces the sheet's estimate.</div>` +
    rows.map(l => {
      const ws = l.work_ids.map(i => byId[i]).filter(Boolean);
      const real = ws.reduce((s, w) => s + mins(w), 0), est = sheetMin(l.sheet_time);
      const compare = real ? `<span class="real">${fmt(real)}</span> ${est && est !== real ? `<span class="est">${fmt(est)}</span>` : ""}` : `<span>${fmt(est)}</span> <span class="chip">estimate</span>`;
      const linked = ws.length ? ws.map(w => esc(w.title_en || w.title)).join(" · ") : "not in your collection (streamed)";
      return `<div class="card"><div class="row"><div class="title">${esc(l.title)}</div><span class="chip">${esc(l.start)} → ${esc(l.finish)}</span>
        <span class="compare">${compare}</span></div><div class="meta">${linked}</div></div>`;
    }).join("");
}

function inbox() {
  const fake = [
    ["YouTube", "【ドラマCD】Paradox Live Stage Battle 'PRIDE' ボイスドラマ", "38 min", "Matches Paradox Live — Stage Battle PRIDE"],
    ["Spotify", "ヒプノシスマイク Drama Track [Know Your Enemy]", "27 min", "Matches HypMic drama tracks"],
    ["Pano Scrobbler", "Ado — 唱", "3 min", "Looks like music"],
  ];
  return `<div class="note">Example only: once ListenBrainz / Audiobookshelf are connected, plays nothing recognises yet land here. Sorting one creates a rule, so the same CD or channel is recognised next time.</div>` +
    fake.map(([src, t, d, hint]) => `<div class="card"><div class="row"><div class="title">${esc(t)}</div><span class="chip">${src}</span><span class="runtime">${d}</span></div>
      <div class="meta">${hint}</div><div class="inbox-actions"><button>Link to work…</button><button>New work</button><button>Music — ignore</button></div></div>`).join("");
}

function render() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
  const main = document.getElementById("main");
  main.innerHTML = { collection, listened, inbox }[state.tab]();
  main.querySelectorAll("[data-f]").forEach(el => el.addEventListener(el.tagName === "INPUT" ? "input" : "change", e => {
    state[el.dataset.f] = e.target.value;
    const pos = el.tagName === "INPUT" ? el.selectionStart : null;
    render();
    if (pos !== null) { const i = document.querySelector('[data-f="q"]'); i.focus(); i.setSelectionRange(pos, pos); }
  }));
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => { state.tab = b.dataset.tab; render(); }));
stats(); render();
</script>
</body>
</html>
